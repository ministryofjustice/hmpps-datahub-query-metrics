---
generic-service:
  serviceAccountName: "datahub-query-metrics-dev-cross-iam"

  ingress:
    host: hmpps-datahub-query-metrics-dev.hmpps.service.justice.gov.uk
    modsecurity_enabled: true

  env:
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: "applicationinsights.dev.json"
    REDSHIFT_DATA_CLUSTER_ID: dpr-redshift-development
    AWS_ACCOUNTID: "771283872747"

  allowlist:
    groups:
      - digital_staff_and_mojo
      - moj_cloud_platform

generic-prometheus-alerts:
  businessHoursOnly: true
  alertSeverity: digital-prison-reporting-dev
