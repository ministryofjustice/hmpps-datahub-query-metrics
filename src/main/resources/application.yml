info.app:
  name: HMPPS Template Kotlin
  version: 1.0

spring:
  autoconfigure:
    exclude:
      uk.gov.justice.hmpps.kotlin.auth.HmppsResourceServerConfiguration
  application:
    name: hmpps-datahub-query-metrics
  datasource:
    url: ${REDSHIFT_JDBC_URL}
    username: ${REDSHIFT_JDBC_USER}
    password: ${REDSHIFT_JDBC_PASSWORD}
    driver-class-name: com.amazon.redshift.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      pool-name: redshift-pool

#  This jackson configuration is only applied for java.util.Date.
#  It is ignored for LocalDateTime, and therefore unnecessary for most projects
#  jackson:
#    date-format: "yyyy-MM-dd HH:mm:ss"

  http:
    codecs:
      max-in-memory-size: 10MB
  web:
    error:
      include-message: always

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|100\.6[4-9]\.\d{1,3}\.\d{1,3}|100\.[7-9][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.1[0-1][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.12[0-7]\.\d{1,3}\.\d{1,3}
  shutdown: graceful

management:
  metrics:
    all: false
  endpoints:
    web:
      base-path: /
      exposure:
        include: '*'
  endpoint:
    health:
      cache:
        time-to-live: 2000ms
      show-components: always
      show-details: always
      probes:
        enabled: true
    info:
      cache:
        time-to-live: 2000ms

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

dpr:
  athena:
    workgroup: dpr-generic-athena-workgroup
  redshift:
    secretarn: ${REDSHIFT_DATA_SECRETARN}
    clusterid: ${REDSHIFT_DATA_CLUSTER_ID}
    database: ${REDSHIFT_DATA_DB}
